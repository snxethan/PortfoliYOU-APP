<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfoli-YOU</title>
  <link rel="icon" type="image/png" href="/icon.ico" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background-color: #0b1220;
      color: #e6f0ff;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    body.py-preload,
    body.py-preload #root {
      background-color: #0b1220;
    }

    #py-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(251, 146, 60, 0.12), transparent 55%), #0b1220;
      z-index: 2147483000;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    #py-loader.py-loader--hidden {
      opacity: 0;
    }

    #py-loader .py-loader__inner {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      padding: 2.25rem 2.75rem;
      border-radius: 1rem;
      background: rgba(16, 25, 43, 0.92);
      border: 1px solid rgba(28, 42, 58, 0.9);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    #py-loader .py-loader__spinner {
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      border: 4px solid rgba(28, 42, 58, 0.85);
      border-top-color: #06b6d4;
      animation: py-spin 1s linear infinite;
    }

    #py-loader p {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9fb3c8;
    }

    #py-loader .py-loader__brand {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #f8fafc;
    }

    @keyframes py-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="py-preload">
  <div id="py-loader" role="status" aria-live="polite">
    <div class="py-loader__inner">
      <div class="py-loader__spinner"></div>
      <div class="py-loader__brand">Portfoli-YOU</div>
      <p>Initializing workspace…</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
