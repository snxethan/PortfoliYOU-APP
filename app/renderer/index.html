<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfoli-YOU</title>
  <link rel="icon" type="image/png" href="/icon.ico" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <!-- Loader styles are centralized in `src/index.css` to support theming. -->
  <script>
    // Set theme early so CSS can style the initial loader appropriately.
    (function () {
      try {
        var t = localStorage.getItem('py_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <!-- Critical loader CSS: keeps the loader styled before the main CSS loads -->
  <style>
    :root {
      --py-loader-bg: #0b1220;
      --py-loader-surface: #10192b;
      --py-loader-border: #1c2a3a;
      --py-loader-fg-muted: #9fb3c8;
      --py-loader-brand: #f8fafc;
      --py-loader-accent: #06b6d4;
    }

    :root[data-theme='light'] {
      --py-loader-bg: #ffffff;
      --py-loader-surface: #f7f9fc;
      --py-loader-border: #e2e8f0;
      --py-loader-fg-muted: #4a5568;
      --py-loader-brand: #050505;
      --py-loader-accent: #06b6d4;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--py-loader-bg);
      color: var(--py-loader-brand);
      font-family: Inter, Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif
    }

    #py-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, color-mix(in oklab, var(--py-loader-accent) 8%, transparent), transparent 55%), var(--py-loader-bg);
      z-index: 2147483000;
      transition: opacity .35s ease;
      pointer-events: none
    }

    #py-loader.py-loader--hidden {
      opacity: 0
    }

    #py-loader .py-loader__inner {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      padding: 1.25rem 1.75rem;
      border-radius: 1rem;
      background: color-mix(in oklab, var(--py-loader-surface) 92%, transparent);
      border: 1px solid color-mix(in oklab, var(--py-loader-border) 90%, transparent);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
      text-align: center
    }

    #py-loader .py-loader__spinner {
      width: 48px;
      height: 48px;
      border-radius: 9999px;
      border: 4px solid color-mix(in oklab, var(--py-loader-border) 85%, transparent);
      border-top-color: var(--py-loader-accent);
      animation: py-spin 1s linear infinite
    }

    #py-loader p {
      margin: 0;
      font-size: .95rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--py-loader-fg-muted)
    }

    #py-loader .py-loader__brand {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: .06em;
      color: var(--py-loader-brand)
    }

    @keyframes py-spin {
      to {
        transform: rotate(360deg)
      }
    }
  </style>
</head>

<body class="py-preload">
  <div id="py-loader" role="status" aria-live="polite">
    <div class="py-loader__inner">
      <div class="py-loader__spinner"></div>
      <div class="py-loader__brand">Portfoli-YOU</div>
      <p>A Portfolio for you, by you.</p>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
